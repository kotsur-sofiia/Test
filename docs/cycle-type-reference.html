<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Типографика цикла — 1080 × 1080</title>
  <link rel="stylesheet" href="../typography.css?v=101">
  <style>
    html,body { margin:0; width:1080px; height:1080px; background:#fff; }
    #cycle,.cycle-dial { position:relative; width:1080px; height:1080px; }
  </style>
</head>
<body>
  <main id="cycle"><div class="cycle-dial"><div class="cycle-dial-copy">
    <span id="cycle-dial-phase"><span id="cycle-phase-word">фаза</span><span id="cycle-phase-name">ЛЮТЕИНОВАЯ</span></span>
    <strong id="cycle-dial-day">31</strong>
    <span class="cycle-day-label">-день цикла-</span>
    <span id="cycle-dial-countdown" class="is-delayed"><span id="cycle-countdown-label">ЗАДЕРЖКА</span><span id="cycle-countdown-value">≈ 1 день</span></span>
  </div></div></main>
</body>
</html>
